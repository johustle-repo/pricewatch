name: pricewatch_apk
description: Offline-first commodity price monitoring and reporting app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.11
  firebase_auth: ^5.7.0
  cloud_functions: ^5.6.2
  provider: ^6.1.5
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^0.71.0
  intl: ^0.20.2
  crypto: ^3.0.6
  collection: ^1.19.1
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.0
  sqflite_common_ffi: ^2.4.0+2
  sqflite_common_ffi_web: ^1.1.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2
  file_saver: ^0.3.1
  pdf: ^3.11.3
  file_picker: ^10.3.10
  csv: ^6.0.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/branding/
    - assets/images/products/
